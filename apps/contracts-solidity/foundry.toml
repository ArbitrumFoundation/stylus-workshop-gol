# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  bytecode_hash = "none"
  # Arbitrum Nitro runs Cancun-class EVM semantics; "paris" forced solc
  # to emit older opcodes and disabled features like transient storage.
  evm_version = "cancun"
  fuzz = { runs = 1_000 }
  gas_reports = ["*"]
  optimizer = true
  optimizer_runs = 10_000
  via_ir = true
  out = "out"
  script = "script"
  solc = "0.8.36"
  src = "src"
  test = "test"

[profile.ci]
  fuzz = { runs = 10_000 }
  verbosity = 4

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[rpc_endpoints]
  # The workshop runs entirely against a local Arbitrum Nitro devnode.
  # Add public-chain endpoints here when you take this contract to
  # Arbitrum Sepolia or mainnet.
  localhost = "http://localhost:8547"
